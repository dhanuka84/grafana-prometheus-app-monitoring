# loki-values.yaml
deploymentMode: SingleBinary

loki:
  auth_enabled: false

  server:
    http_listen_port: 3100

  commonConfig:
    replication_factor: 1
    path_prefix: /tmp/loki       # <— key line (avoids /var/loki)

  storage:
    type: filesystem
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules

  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb               # or boltdb-shipper if you disabled structured metadata
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  ruler:
    storage:
      type: local
      local:
        directory: /tmp/loki/rules

  compactor:
    working_directory: /tmp/loki/compactor
    compaction_interval: 5m

  limits_config:
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
    allow_structured_metadata: true  # set to false if you use boltdb-shipper

  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  persistence:
    enabled: false

read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }

gateway:
  enabled: false

service:
  type: ClusterIP
